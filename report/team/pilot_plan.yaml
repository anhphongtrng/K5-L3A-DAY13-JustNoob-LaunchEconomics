# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48, cần 3.103 yêu cầu và 42 nhân viên mỗi nhóm. Tổng 84 > 40.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng < 1.000, chưa đạt 1.251.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng < 300, chưa đạt 1.251.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần ít nhất 299 yêu cầu mỗi nhân viên, DE = 6,96.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng tiếp tục xử lý thủ công cùng thời gian và tại các depot tham gia.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm theo nhân viên, phân tầng theo depot; ghi seed và khóa danh sách 20/20 trước rollout.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có thể chia sẻ gợi ý trong depot. Giới hạn quyền theo tài khoản và giám sát lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Chốt trước khi chạy theo mục identifiability, stop_rules và decision_date.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm khi rollout đạt 50%; bắt đầu đo chỉ số chính ở bước này.
#
# Đánh đổi đã chấp nhận: Chia theo nhân viên để giảm ảnh hưởng giữa hai nhóm. Theo D1(c), cỡ mẫu hiệu dụng < 1.000 mỗi nhóm nên thiếu so với 1.251 để phát hiện +5 điểm phần trăm ở power 80%.
# Theo D1(e), thiết kế cho +6 điểm phần trăm cần ít nhất 299 yêu cầu đủ điều kiện/nhân viên (5.980 yêu cầu thực tế/nhóm, khoảng 859 mẫu hiệu dụng, DE = 6,96).
# Nếu chênh lệch thật là +5 điểm phần trăm thì power khoảng 64% theo hướng dẫn D1. MDE +6 điểm là tham số thiết kế; tiêu chí kinh doanh của đề bài vẫn là +5 điểm.
#
# Căn cứ D3 từ src/logix_requests.csv (giả lập): mở lại 7 ngày = 51/1.200 (4,25%) toàn mẫu; 39/982 (3,97%) nếu lọc noi_dia + hang_nang.
# Bỏ qua gợi ý = 48/177 (27,12%) trên các yêu cầu được xem lại. Lấy ngưỡng +2 điểm phần trăm, trần 6% và ngưỡng bỏ qua 40% từ hướng dẫn lab D3 làm ngưỡng vận hành.
# Căn cứ phạm vi (bang_chi_phi.md, A3): noi_dia có 824 yêu cầu, thành công 95,0% và CPS 2.696 đ (simulated); hang_nang có 158 yêu cầu, thành công 74,1% và CPS 8.221 đ (simulated). Cả hai thấp hơn mức xử lý thủ công 12.000 đ.
# Giữ quoc_te ngoài pilot vì CPS 22.515 đ (simulated) vượt mức thủ công; giữ doi_tac xử lý thủ công vì có điều khoản riêng, thành công 54,4% và CPS 10.215 đ (simulated), sát hơn mức thủ công.
# Trước rollout, xác nhận danh sách 40 nhân viên đủ điều kiện tại các depot và khả năng thu ít nhất 299 yêu cầu trong phạm vi mỗi người theo D1(e).
# Ngưỡng chi phí 10.000 đ/ca là ngưỡng vận hành đề xuất: cao hơn CPS hàng nặng 8.221 đ (A3) và thấp hơn mức thủ công 12.000 đ. B4 cho thấy xem lại 100% có thể lên 12.415 đ/ca (simulated).
# CPS tuần tính theo A2: tổng chi phí token, tool, xem lại và làm lại của mọi yêu cầu trong nhóm can thiệp thuộc kỳ đo, chia số yêu cầu thành công của cùng tập. Dùng thời gian nhân viên đo trong pilot.
# Biện pháp tối đa 2 lần chạy dựa trên B3: 6.901.220 đ tổng chi phí hệ thống (simulated), thấp nhất trong ba kịch bản 1–3 lần trên toàn mẫu.
# Lịch dự kiến: bắt đầu rollout ngày 2026-12-01 nếu được duyệt; mỗi bước tối thiểu một tuần. Đến ngày quyết định phải đủ mẫu và đủ cửa sổ theo dõi 7 ngày sau lần đóng đầu. Nếu thiếu, giữ phạm vi hiện tại và hẹn mốc đánh giá mới.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ nhận yêu cầu noi_dia và hang_nang. Tuyển nhân viên từ 12 depot của LogiX-VN, chia 20 can thiệp và 20 đối chứng theo D2. Yêu cầu quoc_te và doi_tac tiếp tục xử lý thủ công."
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước tối thiểu một tuần và chỉ tăng khi qua các luật dừng
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; thu ít nhất 5.980 yêu cầu thực tế mỗi nhóm
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Nhóm đối chứng giữ nguyên và xử lý thủ công cùng thời gian với nhóm can thiệp. Tính chỉ số chính từ khi có đủ 20 nhân viên can thiệp ở bước rollout 50%."
    spillover_risk: "Nhân viên cùng depot có thể chia sẻ gợi ý. Chỉ cấp quyền cho tài khoản can thiệp và kiểm tra log mở trợ lý theo staff_id để phát hiện sử dụng ngoài nhóm."
    predeclared: "Khóa seed, danh sách phân nhóm, chỉ số chính và luật dừng trước rollout. Tại ngày quyết định, chỉ đề xuất mở rộng khi đủ mẫu và thời gian theo dõi, chênh lệch chỉ số chính đạt ít nhất +5 điểm phần trăm so với đối chứng, kiểm định hai phía có p < 0,05 với sai số chuẩn theo cụm nhân viên và các luật vận hành đều đạt."
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm can thiệp cao hơn đối chứng ít nhất 2 điểm phần trăm hoặc vượt 6% TRONG 3 lần kiểm tra hằng ngày liên tiếp, mỗi lần dùng cửa sổ 7 ngày gần nhất có đủ thời gian theo dõi cho cả hai nhóm, THÌ Giám đốc vận hành kích hoạt quay lui trong 30 phút, KHÔNG THÌ giữ bước rollout hiện tại cho đến khi có đủ dữ liệu an toàn để duyệt bước tiếp."
    - "NẾU chi phí trên mỗi yêu cầu thành công của nhóm can thiệp vượt 10.000 đ TRONG hai tuần đo hoàn chỉnh liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia, giới hạn tối đa 2 lần chạy và đưa phần còn lại về xử lý thủ công, KHÔNG THÌ chỉ mở rộng khi đủ hai tuần dữ liệu chi phí và các luật an toàn, sử dụng đều đạt. Nếu có chi phí phát sinh nhưng không có ca thành công thì tính tuần đó là vượt ngưỡng."
    - "NẾU tỉ lệ bỏ qua gợi ý của nhóm can thiệp vượt 40%, tính bằng số yêu cầu có quyết định cuối là sua hoặc bo chia số yêu cầu đã xem lại, TRONG một tuần rollout đã kết thúc, THÌ Trưởng nhóm CSKH tạm dừng tăng rollout và phỏng vấn 5 nhân viên trong 3 ngày, KHÔNG THÌ chỉ tăng rollout khi các điều kiện an toàn và chi phí cũng đạt. Giữ nguyên bước nếu tuần đó chưa có yêu cầu được xem lại."
  interim_looks: "Chỉ theo dõi an toàn, chi phí và mức độ sử dụng để áp dụng luật vận hành. Kiểm định chỉ số chính tại mốc quyết định khi đủ mẫu và thời gian theo dõi."
  rollback: "Trong vòng 30 phút từ khi kích hoạt, Giám đốc vận hành tắt cờ trợ lý và chuyển yêu cầu mới sang luồng CSKH thủ công. Trưởng nhóm CSKH chuyển các yêu cầu đang xử lý sang hàng đợi thủ công kèm trạng thái và trace_id. Nhân viên kiểm tra trạng thái giao dịch trong sổ cái trước khi gửi lại lệnh hoàn tiền để tránh hoàn trùng."
  decision_date: "2027-01-26"
  simulated_inputs:
    - "logix_requests.csv giả lập. Mở lại 7 ngày 51/1.200 toàn mẫu và 39/982 trong phạm vi; bỏ qua gợi ý 48/177 toàn mẫu."
    - "A3, chi phí dùng phut_xem_lai_simulated và phut_lam_lai_simulated. CPS noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ."
    - "B3, tổng chi phí hệ thống simulated cho tối đa 2 lần chạy là 6.901.220 đ trên toàn mẫu."
    - "B4, CPS simulated khi xem lại 100% và làm lại 15,3 phút mỗi ca phải làm lại là 12.415 đ trong phạm vi pilot."

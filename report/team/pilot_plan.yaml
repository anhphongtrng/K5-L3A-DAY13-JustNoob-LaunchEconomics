# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48, cần 3.103 yêu cầu và 42 nhân viên mỗi nhóm. Tổng 84 > 40.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng < 1.000, chưa đạt 1.251.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng < 300, chưa đạt 1.251.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần ít nhất 299 yêu cầu mỗi nhân viên, DE = 6,96.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng tiếp tục xử lý thủ công cùng thời gian và tại các depot tham gia.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm theo nhân viên, phân tầng theo depot; ghi seed và khóa danh sách 20/20 trước rollout.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có thể chia sẻ gợi ý trong depot. Giới hạn quyền theo tài khoản và giám sát lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Chốt trước khi chạy; ngày quyết định và luật dừng sẽ điền ở D3.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm khi rollout đạt 50%; bắt đầu đo chỉ số chính ở bước này.
#
# Đánh đổi đã chấp nhận: Chia theo nhân viên để giảm ảnh hưởng giữa hai nhóm. Theo D1(c), cỡ mẫu hiệu dụng < 1.000 mỗi nhóm nên thiếu so với 1.251 để phát hiện +5 điểm phần trăm ở power 80%.
# Theo D1(e), thiết kế cho +6 điểm phần trăm cần ít nhất 299 yêu cầu đủ điều kiện/nhân viên (5.980 yêu cầu thực tế/nhóm, khoảng 859 mẫu hiệu dụng, DE = 6,96).
# Nếu chênh lệch thật là +5 điểm phần trăm thì power khoảng 64% theo hướng dẫn D1. MDE +6 điểm là tham số thiết kế; tiêu chí kinh doanh của đề bài vẫn là +5 điểm.
#
# Căn cứ D3 từ src/logix_requests.csv (giả lập): mở lại 7 ngày = 51/1.200 (4,25%) toàn mẫu; 39/982 (3,97%) nếu lọc noi_dia + hang_nang.
# Bỏ qua gợi ý = 48/177 (27,12%) trên các yêu cầu được xem lại. Lấy ngưỡng +2 điểm phần trăm, trần 6% và ngưỡng bỏ qua 40% từ hướng dẫn lab D3 làm ngưỡng vận hành.
# Căn cứ phạm vi (bang_chi_phi.md, A3): noi_dia có 824 yêu cầu, thành công 95,0% và CPS 2.696 đ (simulated); hang_nang có 158 yêu cầu, thành công 74,1% và CPS 8.221 đ (simulated). Cả hai thấp hơn mức xử lý thủ công 12.000 đ.
# Giữ quoc_te ngoài pilot vì CPS 22.515 đ (simulated) vượt mức thủ công; giữ doi_tac xử lý thủ công vì có điều khoản riêng, thành công 54,4% và CPS 10.215 đ (simulated), sát hơn mức thủ công.
# Trước rollout, xác nhận danh sách 40 nhân viên đủ điều kiện tại các depot và khả năng thu ít nhất 299 yêu cầu trong phạm vi mỗi người theo D1(e).

